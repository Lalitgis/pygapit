[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "pygapit"
version     = "1.1.0"
description = "Python implementation of GAPIT: Genome Association and Prediction Integrated Tool (GLM, MLM, CMLM, MLMM, FarmCPU, BLINK, gBLUP, cBLUP, sBLUP)"
readme      = "README.md"
license     = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"

authors = [
    { name = "PyGAPIT Contributors" },
]

keywords = [
    "GWAS", "genomics", "association-study", "plant-breeding",
    "mixed-model", "genomic-selection", "BLUP", "EMMA",
    "FarmCPU", "BLINK", "MLMM", "bioinformatics", "quantitative-genetics",
    "SNP", "kinship", "heritability",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
bigdata = [
    "h5py>=3.9.0",
    "zarr>=2.16.0",
    "dask[array]>=2023.1.0",
]

[project.urls]
Homepage           = "https://github.com/Lalitgis/pygapit"
Documentation      = "https://github.com/Lalitgis/pygapit#readme"
"Bug Tracker"      = "https://github.com/Lalitgis/pygapit/issues"

[project.scripts]
pygapit = "pygapit.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pygapit*"]

[tool.setuptools.package-data]
pygapit = ["py.typed"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = ["ignore::UserWarning"]

[tool.black]
line-length    = 100
target-version = ["py39"]
